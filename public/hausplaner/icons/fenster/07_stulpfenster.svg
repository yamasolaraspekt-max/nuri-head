      <stop offset="100%" stop-color="#dce4e9" stop-opacity=".86"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity=".20"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity=".14"/>
    </filter>
  </defs>

  <rect width="160" height="160" rx="18" fill="#f8f7f4"/>
  <g filter="url(#shadow)">

    
    <rect x="25" y="30" width="110" height="96" rx="2" fill="url(#frame)" stroke="#0d1115" stroke-width="1.5"/>
    <rect x="32" y="37" width="96" height="82" rx="1" fill="url(#glass)" stroke="#707983" stroke-width="1"/>
    <path d="M35 42 L115 42" stroke="#ffffff" stroke-opacity=".45" stroke-width="2"/>

    <rect x="78" y="37" width="4" height="82" fill="#1c2126"/>
    <path d="M75 70v16m0-2h-8" stroke="#cfd4d8" stroke-width="3" stroke-linecap="round"/>
        <path d="M74 70v16" stroke="#353a40" stroke-width="1"/>
    <path d="M85 70v16m0-2h8" stroke="#cfd4d8" stroke-width="3" stroke-linecap="round"/>
        <path d="M86 70v16" stroke="#353a40" stroke-width="1"/>

